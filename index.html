<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Melody ♡</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Segoe UI",
        sans-serif;

      color: #8f7484;

      background-color: #f9dfeb;

      background-image:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.8) 0 9px,
          transparent 10px
        );

      background-size: 60px 60px;

      padding: 20px;

    }


    .page {

      width: 100%;

      max-width: 430px;

      margin: 0 auto;

    }


    /* 顶部标题 */

    .top {

      text-align: center;

      padding:
        28px
        0
        24px;

    }


    .top-text {

      font-size: 13px;

      letter-spacing: 5px;

      color: #bca3b1;

    }


    /* 美乐蒂主图 */

    .hero {

      position: relative;

      overflow: hidden;

      border-radius: 36px;

      background: #f6d7e5;

      box-shadow:
        0 16px 40px
        rgba(143, 107, 128, 0.14);

    }


    .hero img {

      width: 100%;

      display: block;

      object-fit: cover;

    }


    .hero-box {

      position: absolute;

      left: 22px;

      right: 22px;

      bottom: 22px;

      padding:
        18px
        16px;

      text-align: center;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.76);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      border:
        1px solid
        rgba(255, 255, 255, 0.9);

    }


    .hero-box h1 {

      font-size: 30px;

      color: #9c8293;

      margin-bottom: 7px;

    }


    .hero-box p {

      font-size: 13px;

      color: #b19aa8;

      letter-spacing: 1px;

    }


    /* 标签 */

    .tags {

      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;

      margin:
        22px
        0;

    }


    .tag {

      padding:
        9px
        15px;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.78);

      border:
        1px solid
        rgba(255, 255, 255, 0.95);

      font-size: 12px;

      color: #a9869b;

      box-shadow:
        0 5px 15px
        rgba(150, 110, 130, 0.06);

    }


    /* 白色卡片 */

    .card {

      background:
        rgba(255, 255, 255, 0.78);

      border:
        1px solid
        rgba(255, 255, 255, 0.95);

      border-radius: 30px;

      padding: 24px;

      margin-bottom: 18px;

      box-shadow:
        0 12px 30px
        rgba(145, 108, 130, 0.1);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

    }


    .card-title {

      font-size: 18px;

      font-weight: 600;

      color: #9b7e90;

      margin-bottom: 14px;

    }


    .card p {

      font-size: 14px;

      line-height: 1.9;

      color: #947d8b;

    }


    /* 三个小格子 */

    .favorites {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 15px;

    }


    .favorite-item {

      background:
        rgba(255, 242, 248, 0.95);

      border-radius: 22px;

      padding:
        18px
        8px;

      text-align: center;

      color: #aa8499;

      font-size: 12px;

      border:
        1px solid
        rgba(255, 255, 255, 0.9);

    }


    .favorite-icon {

      font-size: 27px;

      margin-bottom: 8px;

    }


    /* 爱心按钮 */

    .love-button {

      width: 100%;

      border: none;

      border-radius: 22px;

      padding: 15px;

      margin-top: 17px;

      background:
        linear-gradient(
          135deg,
          #efabc9,
          #e99bbb
        );

      color: white;

      font-size: 14px;

      font-weight: 600;

      box-shadow:
        0 8px 20px
        rgba(218, 124, 163, 0.22);

      transition:
        transform 0.2s;

    }


    .love-button:active {

      transform:
        scale(0.96);

    }


    /* 底部 */

    footer {

      text-align: center;

      padding:
        12px
        0
        30px;

      color: #b99aaa;

      font-size: 11px;

      letter-spacing: 1px;

    }


    /* 飘起来的小爱心 */

    .heart {

      position: fixed;

      pointer-events: none;

      color: #e99aba;

      z-index: 999;

      animation:
        heartFloat
        1.6s
        ease
        forwards;

    }


    @keyframes heartFloat {

      from {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

      to {

        opacity: 0;

        transform:
          translateY(-150px)
          scale(1.7);

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <header class="top">

      <div class="top-text">
        MY MELODY WORLD ♡
      </div>

    </header>


    <section class="hero">

      <img
        src="IMG_1658.jpeg"
        alt="My Melody"
      >


      <div class="hero-box">

        <h1>
          welcome ♡
        </h1>

        <p>
          a tiny pink corner
          of the internet
        </p>

      </div>

    </section>


    <div class="tags">

      <div class="tag">
        🎀 melody
      </div>

      <div class="tag">
        🌷 pink
      </div>

      <div class="tag">
        ♡ cute
      </div>

    </div>


    <section class="card">

      <div class="card-title">
        🎀 About me
      </div>

      <p>
        欢迎来到我的小小粉色世界。
        这里会记录一些喜欢的东西、
        日常碎片，
        还有让我开心的小事情 ♡
      </p>

    </section>


    <section class="card">

      <div class="card-title">
        ♡ My favorites
      </div>


      <div class="favorites">


        <div class="favorite-item">

          <div class="favorite-icon">
            🎧
          </div>

          Music

        </div>


        <div class="favorite-item">

          <div class="favorite-icon">
            🍓
          </div>

          Sweet

        </div>


        <div class="favorite-item">

          <div class="favorite-icon">
            🌸
          </div>

          Daily

        </div>


      </div>

    </section>


    <section class="card">

      <div class="card-title">
        💌 Today's message
      </div>


      <p id="message">

        今天也要收集一点点开心 ♡

      </p>


      <button
        class="love-button"
        onclick="sendHeart()"
      >

        send me a heart ♡

      </button>

    </section>


    <footer>

      made with love ·
      my melody world ♡

    </footer>


  </main>


  <script>

    function sendHeart() {

      document
        .getElementById("message")
        .innerText =
        "收到一颗粉色小爱心啦 ♡";


      for (
        let i = 0;
        i < 15;
        i++
      ) {

        const heart =
          document.createElement(
            "div"
          );


        heart.className =
          "heart";


        heart.innerHTML =
          Math.random() > 0.5
          ? "♡"
          : "♥";


        heart.style.left =
          Math.random() * 90
          + "%";


        heart.style.top =
          65
          + Math.random() * 20
          + "%";


        heart.style.fontSize =
          15
          + Math.random() * 20
          + "px";


        document
          .body
          .appendChild(heart);


        setTimeout(
          () => {
            heart.remove();
          },
          1600
        );

      }

    }

  </script>


</body>

</html>
