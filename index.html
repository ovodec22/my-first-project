<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Melody ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #ffe0ed 0 12%, transparent 30%),
        radial-gradient(circle at 90% 20%, #fff0f6 0 10%, transparent 25%),
        linear-gradient(180deg, #fff7fb, #ffe9f3);

      color: #7e5265;
      overflow-x: hidden;
    }

    .bubble {
      position: fixed;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      pointer-events: none;
      animation: float 8s infinite ease-in-out;
    }

    .bubble1 {
      width: 90px;
      height: 90px;
      top: 8%;
      left: -30px;
    }

    .bubble2 {
      width: 120px;
      height: 120px;
      right: -45px;
      top: 35%;
      animation-delay: 2s;
    }

    .bubble3 {
      width: 60px;
      height: 60px;
      left: 12%;
      bottom: 10%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-18px);
      }
    }

    .wrapper {
      width: min(92%, 460px);
      margin: auto;
      padding: 40px 0 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 26px;
    }

    .mini {
      font-size: 13px;
      letter-spacing: 3px;
      color: #d48aa8;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 42px;
      color: #d85f91;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: #a9798e;
    }

    .melody-face {
      width: 150px;
      height: 150px;
      margin: 30px auto;

      background: white;
      border-radius: 45% 45% 48% 48%;

      position: relative;

      box-shadow:
        0 18px 45px rgba(223, 123, 164, 0.2);
    }

    .ear {
      position: absolute;
      width: 50px;
      height: 115px;
      background: #f7a8c7;
      top: -60px;
      border-radius: 50px;
      z-index: -1;
    }

    .ear.left {
      left: 10px;
      transform: rotate(-12deg);
    }

    .ear.right {
      right: 10px;
      transform: rotate(12deg);
    }

    .eye {
      position: absolute;
      top: 67px;
      width: 9px;
      height: 13px;
      background: #6d5961;
      border-radius: 50%;
    }

    .eye.left {
      left: 46px;
    }

    .eye.right {
      right: 46px;
    }

    .nose {
      position: absolute;
      width: 10px;
      height: 8px;
      background: #f3b34c;
      border-radius: 50%;
      left: 50%;
      top: 84px;
      transform: translateX(-50%);
    }

    .bow {
      position: absolute;
      top: 13px;
      right: -8px;
      font-size: 44px;
      transform: rotate(8deg);
    }

    .card {
      background: rgba(255,255,255,0.72);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.95);

      border-radius: 28px;
      padding: 26px;

      margin-bottom: 18px;

      box-shadow:
        0 14px 40px rgba(205, 116, 150, 0.12);
    }

    .card h2 {
      font-size: 19px;
      color: #cf7097;
      margin-bottom: 12px;
    }

    .card p {
      line-height: 1.8;
      font-size: 14px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    button,
    .btn {
      border: none;
      text-decoration: none;

      background: #f5a4c3;
      color: white;

      padding: 14px 16px;

      border-radius: 18px;

      font-size: 14px;
      font-weight: 600;

      text-align: center;

      box-shadow:
        0 8px 18px rgba(222, 111, 155, 0.22);

      transition: 0.2s;
    }

    button:active,
    .btn:active {
      transform: scale(0.96);
    }

    .btn.light {
      background: white;
      color: #d36e96;
    }

    .diary {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    .diary-box {
      flex: 1;
      background: #fff5f9;
      padding: 16px 10px;
      border-radius: 18px;
      text-align: center;
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: #ca91a8;
      font-size: 12px;
      margin-top: 28px;
    }

    .heart {
      position: fixed;
      font-size: 18px;
      pointer-events: none;
      animation: heartFly 1.5s ease forwards;
    }

    @keyframes heartFly {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-120px) scale(1.6);
      }
    }
  </style>
</head>

<body>

  <div class="bubble bubble1"></div>
  <div class="bubble bubble2"></div>
  <div class="bubble bubble3"></div>

  <div class="wrapper">

    <section class="hero">

      <div class="mini">
        WELCOME TO MY LITTLE WORLD
      </div>

      <h1>
        Melody ♡
      </h1>

      <p class="subtitle">
        pink · cute · dreamy
      </p>

      <div class="melody-face">
        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="eye left"></div>
        <div class="eye right"></div>

        <div class="nose"></div>

        <div class="bow">🎀</div>
      </div>

    </section>


    <section class="card">

      <h2>
        🎀 About this page
      </h2>

      <p>
        欢迎来到我的粉色小世界。
        这里会放一些我喜欢的东西、日常记录和可爱的小收藏 ♡
      </p>

      <div class="buttons">

        <button onclick="makeHearts()">
          ♡ 点我
        </button>

        <a
          class="btn light"
          href="https://github.com/"
          target="_blank"
        >
          GitHub
        </a>

      </div>

    </section>


    <section class="card">

      <h2>
        🍓 My little diary
      </h2>

      <div class="diary">

        <div class="diary-box">
          🎧
          <br><br>
          Music
        </div>

        <div class="diary-box">
          🍰
          <br><br>
          Sweet
        </div>

        <div class="diary-box">
          🌷
          <br><br>
          Daily
        </div>

      </div>

    </section>


    <section class="card">

      <h2>
        💌 Today's message
      </h2>

      <p id="message">
        今天也要收集一点点开心 ♡
      </p>

    </section>


    <footer>
      made with ♡
      <br><br>
      my little melody world
    </footer>

  </div>


  <script>

    function makeHearts() {

      for (let i = 0; i < 12; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = "♡";

        heart.style.left =
          Math.random() * 90 + "%";

        heart.style.top =
          60 + Math.random() * 20 + "%";

        heart.style.color =
          "#e881aa";

        heart.style.fontSize =
          16 + Math.random() * 18 + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1500);

      }

      document.getElementById("message").innerText =
        "收到一颗粉色小爱心啦 🎀♡";

    }

  </script>

</body>
</html>
