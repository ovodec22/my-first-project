<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Melody ♡</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  color: #756b78;

  background-color: #fbe1ed;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.75) 0 8px,
      transparent 9px
    );

  background-size: 58px 58px;

  padding: 20px;
}

/* 整个页面 */

.page {
  width: 100%;
  max-width: 430px;
  margin: auto;
}

/* 顶部小字 */

.top {
  text-align: center;
  padding: 18px 0 20px;
}

.top span {
  font-size: 12px;
  letter-spacing: 3px;
  color: #ba9aaa;
}

/* 主图 */

.hero {
  overflow: hidden;
  border-radius: 34px;
  background: #f9dce9;

  box-shadow:
    0 15px 35px rgba(151,126,143,.14);

  position: relative;
}

.hero img {
  width: 100%;
  display: block;
}

.hero-text {
  position: absolute;

  left: 20px;
  right: 20px;
  bottom: 18px;

  background: rgba(255,255,255,.68);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border-radius: 22px;

  padding: 15px 18px;

  text-align: center;
}

.hero-text h1 {
  font-size: 25px;
  color: #9b8193;

  margin-bottom: 4px;
}

.hero-text p {
  font-size: 13px;
  color: #a993a1;
}

/* 小标签 */

.tags {
  display: flex;
  justify-content: center;
  gap: 9px;

  flex-wrap: wrap;

  margin: 22px 0;
}

.tag {
  padding: 8px 14px;

  border-radius: 999px;

  background: rgba(255,255,255,.72);

  border: 1px solid rgba(255,255,255,.9);

  font-size: 12px;

  color: #a78096;
}

/* 卡片 */

.card {

  background:
    rgba(255,255,255,.72);

  border:
    1px solid rgba(255,255,255,.9);

  border-radius: 28px;

  padding: 22px;

  margin-bottom: 16px;

  box-shadow:
    0 12px 30px rgba(146,118,136,.10);
}

.card-title {

  font-size: 16px;

  color: #9c7d90;

  margin-bottom: 12px;
}

.card p {

  font-size: 14px;

  line-height: 1.8;

  color: #927f8b;
}

/* 三个小格子 */

.grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 14px;
}

.item {

  background:
    rgba(255,242,248,.9);

  border-radius: 20px;

  padding: 18px 5px;

  text-align: center;

  font-size: 12px;

  color: #a68297;
}

.item .emoji {

  font-size: 25px;

  margin-bottom: 7px;
}

/* 爱心按钮 */

.love {

  display: block;

  width: 100%;

  border: 0;

  border-radius: 22px;

  padding: 15px;

  background:
    #efa8c8;

  color: white;

  font-size: 14px;

  margin-top: 15px;

  box-shadow:
    0 8px 18px rgba(217,129,167,.22);
}

.love:active {
  transform: scale(.97);
}

/* 页脚 */

footer {

  text-align: center;

  font-size: 11px;

  color: #b89baa;

  padding: 12px 0 30px;
}

/* 飘爱心 */

.heart {

  position: fixed;

  pointer-events: none;

  color: #eda3c4;

  animation:
    floatHeart 1.6s ease forwards;
}

@keyframes floatHeart {

  from {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }

  to {
    opacity: 0;
    transform:
      translateY(-140px)
      scale(1.7);
  }
}

</style>
</head>

<body>

<div class="page">

  <div class="top">
    <span>MY MELODY WORLD ♡</span>
  </div>


  <section class="hero">

    <img
      src="melody.jpg"
      alt="My Melody">

    <div class="hero-text">

      <h1>
        welcome ♡
      </h1>

      <p>
        a tiny pink corner of the internet
      </p>

    </div>

  </section>


  <div class="tags">

    <div class="tag">
      🎀 melody
    </div>

    <div class="tag">
      🌷 pink
    </div>

    <div class="tag">
      ♡ cute
    </div>

  </div>


  <section class="card">

    <div class="card-title">
      🎀 About me
    </div>

    <p>
      欢迎来到我的小小粉色世界。
      这里会记录一些喜欢的东西、
      日常碎片，还有让我开心的小事情 ♡
    </p>

  </section>


  <section class="card">

    <div class="card-title">
      ♡ My favorites
    </div>

    <div class="grid">

      <div class="item">

        <div class="emoji">
          🎧
        </div>

        Music

      </div>

      <div class="item">

        <div class="emoji">
          🍓
        </div>

        Sweet

      </div>

      <div class="item">

        <div class="emoji">
          🌸
        </div>

        Daily

      </div>

    </div>

  </section>


  <section class="card">

    <div class="card-title">
      💌 Today's message
    </div>

    <p id="message">
      今天也要收集一点点开心 ♡
    </p>

    <button
      class="love"
      onclick="love()">

      send me a heart ♡

    </button>

  </section>


  <footer>
    made with love · melody world ♡
  </footer>

</div>


<script>

function love() {

  document
    .getElementById("message")
    .innerText =
    "收到一颗小爱心啦 ♡";

  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const heart =
      document.createElement("div");

    heart.className =
      "heart";

    heart.innerHTML =
      "♡";

    heart.style.left =
      Math.random() * 90
      + "%";

    heart.style.top =
      65 +
      Math.random() * 15
      + "%";

    heart.style.fontSize =
      15 +
      Math.random() * 20
      + "px";

    document.body
      .appendChild(heart);

    setTimeout(
      () => heart.remove(),
      1600
    );

  }

}

</script>

</body>
</html>
